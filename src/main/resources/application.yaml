spring:
  datasource:
    url: jdbc:mysql://localhost:3306/churrasquinho_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  web:
    locale: pt_BR
    locale-resolver: fixed

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        '[format_sql]': true

  thymeleaf:
    cache: false

server:
  port: 8080