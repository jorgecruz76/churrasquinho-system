<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Churrasquinho System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 420px;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #8b0000;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #8b0000;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #8b0000;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #650000;
        }

        .erro {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 5px;
            background-color: #ffebee;
            color: #b71c1c;
            border-left: 4px solid #b71c1c;
            font-size: 14px;
        }

        .link-voltar {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #8b0000;
            text-decoration: none;
            font-size: 14px;
        }

        .link-voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Churrasquinho System</h1>

    <p class="subtitulo">Crie sua conta de cliente</p>

    <div class="erro" th:if="${erro}" th:text="${erro}">
        Mensagem de erro
    </div>

    <form method="post" action="/cadastro">

        <div class="campo">
            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                required
                th:value="${nome}"
                autocomplete="name">
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                th:value="${email}"
                autocomplete="email">
        </div>

        <div class="campo">
            <label for="senha">Senha (mínimo 6 caracteres)</label>
            <input
                type="password"
                id="senha"
                name="senha"
                required
                minlength="6"
                autocomplete="new-password">
        </div>

        <div class="campo">
            <label for="confirmarSenha">Confirmar senha</label>
            <input
                type="password"
                id="confirmarSenha"
                name="confirmarSenha"
                required
                minlength="6"
                autocomplete="new-password">
        </div>

        <button type="submit">Criar conta</button>

    </form>

    <a href="/login" class="link-voltar">← Já tenho conta, fazer login</a>

</div>

</body>

</html>
