<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes - Churrasquinho System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .topo h2 { margin: 0; }

        .botao {
            display: inline-block;
            padding: 10px 16px;
            background-color: #8b0000;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .botao:hover { background-color: #650000; }

        .botao-secundario {
            background-color: #e0e0e0;
            color: #333;
        }
        .botao-secundario:hover { background-color: #cfcfcf; }

        .botao-perigo { background-color: #c62828; }
        .botao-perigo:hover { background-color: #8e0000; }

        .formulario {
            display: none;
            background-color: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .formulario h3 { margin-top: 0; }

        /* ─── Aviso sobre campos opcionais ─── */
        .aviso-campos {
            background-color: #fff8e1;
            color: #7a5b00;
            padding: 10px 14px;
            border-radius: 5px;
            border-left: 4px solid #fbc02d;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .campos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .campo label .obrigatorio {
            color: #c62828;
        }

        .campo input,
        .campo select {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .campo-completo { grid-column: 1 / -1; }

        .acoes-formulario {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .tabela-container {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        th {
            background-color: #8b0000;
            color: white;
        }

        td .botao {
            margin-right: 5px;
            font-size: 12px;
            padding: 6px 10px;
        }

        .mensagem {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 5px;
            display: none;
            border-left: 4px solid transparent;
        }

        .mensagem.erro {
            background-color: #ffebee;
            color: #b71c1c;
            border-left-color: #b71c1c;
        }

        .mensagem.sucesso {
            background-color: #e8f5e9;
            color: #1b5e20;
            border-left-color: #2e7d32;
        }

        .mensagem.visivel { display: block; }

        @media (max-width: 900px) {
            .campos { grid-template-columns: 1fr; }
            .campo-completo { grid-column: auto; }
            main { padding: 0 16px; margin: 20px auto; }
        }
    </style>
</head>

<body>

<!-- ⬇️ HEADER UNIFICADO -->
<div th:replace="~{fragments/header :: header('Gerenciamento de clientes')}"></div>

<main>

    <div class="topo">
        <h2>Clientes</h2>
        <button type="button" class="botao" onclick="mostrarFormulario()">
            + Novo cliente
        </button>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <div id="formularioCliente" class="formulario">

        <h3 id="tituloFormulario">Novo cliente</h3>

        <div class="aviso-campos">
            Os campos <strong>Nome</strong> e <strong>E-mail</strong> são obrigatórios.
            Os demais podem ser preenchidos depois.
        </div>

        <form id="formCliente">

            <input type="hidden" id="clienteId">

            <div class="campos">

                <div class="campo">
                    <label for="nome">Nome <span class="obrigatorio">*</span></label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail <span class="obrigatorio">*</span></label>
                    <input type="email" id="email" maxlength="100" required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" maxlength="14">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" maxlength="20">
                </div>

                <div class="campo campo-completo">
                    <label for="logradouro">Logradouro</label>
                    <input type="text" id="logradouro" maxlength="150">
                </div>

                <div class="campo">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" maxlength="10">
                </div>

                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" maxlength="100">
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" maxlength="100">
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" maxlength="2">
                </div>

                <div class="campo">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" maxlength="9">
                </div>

                <div class="campo">
                    <label for="ativo">Ativo</label>
                    <select id="ativo">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>

            </div>

            <div class="acoes-formulario">
                <button type="submit" class="botao">Salvar</button>
                <button type="button" class="botao botao-secundario"
                        onclick="ocultarFormulario()">
                    Cancelar
                </button>
            </div>

        </form>

    </div>

    <div class="tabela-container">

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Cidade/UF</th>
                <th>CEP</th>
                <th>Ativo</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody id="tabelaClientes">
            </tbody>
        </table>

    </div>

</main>

<script>

    function mostrarMensagem(texto, tipo) {
        const mensagem = document.getElementById('mensagem');

        mensagem.textContent = texto;
        mensagem.className = 'mensagem visivel ' + tipo;

        setTimeout(() => {
            mensagem.classList.remove('visivel');
        }, 4000);
    }

    async function carregarClientes() {

        try {
            const resposta = await fetch('/clientes');

            if (!resposta.ok) {
                throw new Error('Erro ao carregar clientes.');
            }

            const clientes = await resposta.json();

            const tabela = document.getElementById('tabelaClientes');

            tabela.innerHTML = '';

            clientes.forEach(cliente => {

                const linha = document.createElement('tr');

                linha.innerHTML = `
                    <td>${cliente.id}</td>
                    <td>${cliente.nome}</td>
                    <td>${cliente.cpf ?? ''}</td>
                    <td>${cliente.telefone ?? ''}</td>
                    <td>${cliente.email ?? ''}</td>
                    <td>${cliente.cidade ?? ''}/${cliente.estado ?? ''}</td>
                    <td>${cliente.cep ?? ''}</td>
                    <td>${cliente.ativo ? 'Sim' : 'Não'}</td>
                    <td>
                        <button type="button"
                                class="botao botao-secundario"
                                onclick="editarCliente(${cliente.id})">
                            Editar
                        </button>

                        <button type="button"
                                class="botao botao-perigo"
                                onclick="excluirCliente(${cliente.id})">
                            Excluir
                        </button>
                    </td>
                `;

                tabela.appendChild(linha);
            });

        } catch (erro) {

            mostrarMensagem(erro.message, 'erro');
        }
    }

    function mostrarFormulario() {

        document.getElementById('formularioCliente').style.display = 'block';

        document.getElementById('tituloFormulario').textContent =
            'Novo cliente';

        document.getElementById('formCliente').reset();

        document.getElementById('clienteId').value = '';

        document.getElementById('ativo').value = 'true';
    }

    function ocultarFormulario() {

        document.getElementById('formularioCliente').style.display = 'none';

        document.getElementById('formCliente').reset();

        document.getElementById('clienteId').value = '';
    }

    async function editarCliente(id) {

        try {

            const resposta = await fetch('/clientes/' + id);

            if (!resposta.ok) {
                throw new Error('Erro ao carregar cliente.');
            }

            const cliente = await resposta.json();

            document.getElementById('clienteId').value = cliente.id;
            document.getElementById('nome').value = cliente.nome;
            document.getElementById('cpf').value = cliente.cpf ?? '';
            document.getElementById('telefone').value = cliente.telefone ?? '';
            document.getElementById('email').value = cliente.email ?? '';
            document.getElementById('logradouro').value = cliente.logradouro ?? '';
            document.getElementById('numero').value = cliente.numero ?? '';
            document.getElementById('bairro').value = cliente.bairro ?? '';
            document.getElementById('cidade').value = cliente.cidade ?? '';
            document.getElementById('estado').value = cliente.estado ?? '';
            document.getElementById('cep').value = cliente.cep ?? '';
            document.getElementById('ativo').value =
                cliente.ativo ? 'true' : 'false';

            document.getElementById('tituloFormulario').textContent =
                'Editar cliente';

            document.getElementById('formularioCliente').style.display =
                'block';

        } catch (erro) {

            mostrarMensagem(erro.message, 'erro');
        }
    }

    async function excluirCliente(id) {

        if (!confirm('Deseja realmente excluir este cliente?')) {
            return;
        }

        try {

            const resposta = await fetch('/clientes/' + id, {
                method: 'DELETE'
            });

            if (!resposta.ok) {

                const texto = await resposta.text();

                throw new Error(
                    texto || 'Não foi possível excluir o cliente.'
                );
            }

            mostrarMensagem('Cliente excluído com sucesso.', 'sucesso');

            carregarClientes();

        } catch (erro) {

            mostrarMensagem(erro.message, 'erro');
        }
    }

    document.getElementById('formCliente')
        .addEventListener('submit', async function(evento) {

            evento.preventDefault();

            const id = document.getElementById('clienteId').value;

            // Campos obrigatórios
            const nome  = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!nome) {
                mostrarMensagem('O nome é obrigatório.', 'erro');
                return;
            }

            if (!email) {
                mostrarMensagem('O e-mail é obrigatório.', 'erro');
                return;
            }

            // Campos opcionais (null se vazios)
            const cliente = {
                nome: nome,
                email: email.toLowerCase(),
                cpf: document.getElementById('cpf').value.trim() || null,
                telefone: document.getElementById('telefone').value.trim() || null,
                logradouro: document.getElementById('logradouro').value.trim() || null,
                numero: document.getElementById('numero').value.trim() || null,
                bairro: document.getElementById('bairro').value.trim() || null,
                cidade: document.getElementById('cidade').value.trim() || null,
                estado: document.getElementById('estado').value.trim().toUpperCase() || null,
                cep: document.getElementById('cep').value.trim() || null,
                ativo: document.getElementById('ativo').value === 'true'
            };

            try {

                let resposta;

                if (id) {
                    resposta = await fetch('/clientes/' + id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(cliente)
                    });
                } else {
                    resposta = await fetch('/clientes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(cliente)
                    });
                }

                if (!resposta.ok) {
                    const texto = await resposta.text();
                    throw new Error(
                        texto || 'Não foi possível salvar o cliente.'
                    );
                }

                ocultarFormulario();

                mostrarMensagem(
                    id ? 'Cliente atualizado com sucesso.'
                       : 'Cliente cadastrado com sucesso.',
                    'sucesso'
                );

                carregarClientes();

            } catch (erro) {

                mostrarMensagem(erro.message, 'erro');
            }
        });

    carregarClientes();

</script>

</body>

</html>
