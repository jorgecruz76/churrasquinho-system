<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Churrasquinho System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .login {
            width: 380px;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #8b0000;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #8b0000;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #8b0000;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #650000;
        }

        .erro {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 5px;
            background-color: #ffebee;
            color: #b71c1c;
            border-left: 4px solid #b71c1c;
            font-size: 14px;
        }

        .sucesso {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 5px;
            background-color: #e8f5e9;
            color: #1b5e20;
            border-left: 4px solid #2e7d32;
            font-size: 14px;
        }

        .divisor {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0;
            color: #999;
            font-size: 13px;
        }

        .divisor::before,
        .divisor::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #ddd;
        }

        .botao-secundario {
            display: block;
            width: 100%;
            text-align: center;
            padding: 11px;
            border: 1px solid #8b0000;
            border-radius: 5px;
            background-color: white;
            color: #8b0000;
            font-size: 15px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .botao-secundario:hover {
            background-color: #ffe5e5;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Churrasquinho System</h1>

    <p class="subtitulo">Acesse sua conta</p>

    <div id="mensagemErro" class="erro" style="display: none;">
        E-mail ou senha inválidos.
    </div>

    <div id="mensagemSucesso" class="sucesso" style="display: none;">
        Conta criada com sucesso! Faça login para continuar.
    </div>

    <form method="post" action="/login">

        <div class="campo">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email">
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                required
                autocomplete="current-password">
        </div>

        <input type="hidden" name="redirect" id="redirectInput" value="">
        <button type="submit">
            Entrar
        </button>

    </form>

    <div class="divisor">ou</div>

    <a href="/cadastro" class="botao-secundario">
        Criar conta
    </a>

</div>

<script>
    const parametros = new URLSearchParams(window.location.search);

    if (parametros.has('erro')) {
        document.getElementById('mensagemErro').style.display = 'block';
    }

    if (parametros.has('cadastro')) {
        document.getElementById('mensagemSucesso').style.display = 'block';
    }

    if (parametros.has('redirect')) {
        document.getElementById('redirectInput').value = parametros.get('redirect');
    }
</script>

</body>

</html>
