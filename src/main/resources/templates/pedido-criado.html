<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido criado - Churrasquinho System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .cartao {
            width: 480px;
            max-width: 90%;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .icone {
            font-size: 64px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 12px;
            color: #2e7d32;
            font-size: 1.5rem;
        }

        p {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .numero-pedido {
            background-color: #fff8e1;
            color: #7a5b00;
            padding: 16px;
            border-radius: 6px;
            border-left: 4px solid #fbc02d;
            margin-bottom: 24px;
            font-size: 15px;
        }

        .numero-pedido strong {
            font-size: 1.3rem;
            color: #8b0000;
        }

        .acoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
        }

        .botao {
            display: block;
            padding: 12px 24px;
            background-color: #8b0000;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.2s;
            text-align: center;
        }

        .botao:hover {
            background-color: #650000;
        }

        .botao-pagar {
            background-color: #2e7d32;
        }

        .botao-pagar:hover {
            background-color: #1b5e20;
        }

        .botao-secundario {
            background-color: #e0e0e0;
            color: #333;
        }

        .botao-secundario:hover {
            background-color: #cfcfcf;
        }
    </style>
</head>

<body>

<div class="cartao">

    <div class="icone">✅</div>

    <h1>Pedido criado com sucesso!</h1>

    <div class="numero-pedido">
        Seu pedido é o <strong>#<span th:text="${pedidoId}">0</span></strong>
    </div>

    <p>
        Escolha uma das opções abaixo para continuar.
    </p>

    <div class="acoes">

        <a th:href="@{'/pagamento/' + ${pedidoId}}"
           class="botao botao-pagar">
            💳 Pagar agora
        </a>

        <a href="/meus-pedidos" class="botao">
            Ver meus pedidos
        </a>

        <a href="/catalogo" class="botao botao-secundario">
            Continuar comprando
        </a>

    </div>

</div>

</body>

</html>
