<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Churrasquinho System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .topo h2 { margin: 0; }

        .botoes {
            display: flex;
            gap: 10px;
        }

        .botao {
            display: inline-block;
            padding: 10px 16px;
            background-color: #8b0000;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .botao:hover { background-color: #650000; }

        .botao-secundario {
            background-color: #e0e0e0;
            color: #333;
        }
        .botao-secundario:hover { background-color: #cfcfcf; }

        .botao-perigo { background-color: #c62828; }
        .botao-perigo:hover { background-color: #8e0000; }

        .formulario {
            display: none;
            background-color: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .formulario h3 { margin-top: 0; }

        .campos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .campo input,
        .campo select {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .campo-completo { grid-column: 1 / -1; }

        .acoes-formulario {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .tabela-container {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        th {
            background-color: #8b0000;
            color: white;
        }

        td .botao {
            margin-right: 5px;
            font-size: 12px;
            padding: 6px 10px;
        }

        .estoque-baixo {
            background-color: #fff8e1;
            color: #7a5b00;
            font-weight: bold;
            text-align: center;
        }

        .estoque-zero {
            background-color: #ffe0b2;
            color: #e65100;
            font-weight: bold;
            text-align: center;
        }

        .estoque-negativo {
            background-color: #ffebee;
            color: #c62828;
            font-weight: bold;
            text-align: center;
        }

        .mensagem {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 5px;
            display: none;
            border-left: 4px solid transparent;
        }

        .mensagem.erro {
            background-color: #ffebee;
            color: #b71c1c;
            border-left-color: #b71c1c;
        }

        .mensagem.sucesso {
            background-color: #e8f5e9;
            color: #1b5e20;
            border-left-color: #2e7d32;
        }

        .mensagem.visivel { display: block; }

        @media (max-width: 900px) {
            .campos { grid-template-columns: 1fr; }
            .campo-completo { grid-column: auto; }
            main { padding: 0 16px; margin: 20px auto; }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/header :: header('Gerenciamento de produtos')}"></div>

<main>

    <div class="topo">
        <h2>Produtos</h2>

        <div class="botoes">
            <button type="button" class="botao" onclick="mostrarFormulario()">
                + Novo produto
            </button>
        </div>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <div id="formularioProduto" class="formulario">

        <h3 id="tituloFormulario">Novo produto</h3>

        <form id="formProduto">

            <input type="hidden" id="produtoId">

            <div class="campos">

                <div class="campo campo-completo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo campo-completo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao">
                </div>

                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" min="0" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="estoque">Estoque</label>
                    <!-- REMOVIDO min="0" pra permitir ajuste negativo pelo ADM -->
                    <input type="number" id="estoque" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Selecione uma categoria</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="ativo">Ativo</label>
                    <select id="ativo">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>

            </div>

            <div class="acoes-formulario">
                <button type="submit" class="botao">Salvar</button>
                <button type="button" class="botao botao-secundario"
                        onclick="ocultarFormulario()">
                    Cancelar
                </button>
            </div>

        </form>

    </div>

    <div class="tabela-container">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Categoria</th>
                <th>Ativo</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody id="tabelaProdutos">
            </tbody>

        </table>

    </div>

</main>

<script>

    function mostrarMensagem(texto, tipo) {
        const mensagem = document.getElementById('mensagem');

        mensagem.textContent = texto;
        mensagem.className = 'mensagem visivel ' + tipo;

        setTimeout(() => {
            mensagem.classList.remove('visivel');
        }, 4000);
    }

    async function carregarCategorias() {

        try {

            const resposta = await fetch('/categorias');

            if (!resposta.ok) {
                throw new Error('Erro ao carregar categorias.');
            }

            const categorias = await resposta.json();

            const select = document.getElementById('categoria');

            select.innerHTML =
                '<option value="">Selecione uma categoria</option>';

            categorias.forEach(categoria => {

                const option = document.createElement('option');

                option.value = categoria.id;
                option.textContent = categoria.nome;

                select.appendChild(option);
            });

        } catch (erro) {

            console.error(erro);

            mostrarMensagem(erro.message, 'erro');
        }
    }

    async function carregarProdutos() {

        try {

            const resposta = await fetch('/produtos');

            if (!resposta.ok) {
                throw new Error('Erro ao carregar produtos.');
            }

            const produtos = await resposta.json();

            const tabela = document.getElementById('tabelaProdutos');

            tabela.innerHTML = '';

            produtos.forEach(produto => {

                const linha = document.createElement('tr');

                // Determina classe + ícone do estoque
                const est = produto.estoque == null ? 0 : produto.estoque;
                let classeEstoque = 'estoque-normal';
                let iconeEstoque = '';

                if (est < 0) {
                    classeEstoque = 'estoque-negativo';
                    iconeEstoque = ' 🚨';
                } else if (est === 0) {
                    classeEstoque = 'estoque-zero';
                    iconeEstoque = ' ⚠️';
                } else if (est <= 5) {
                    classeEstoque = 'estoque-baixo';
                    iconeEstoque = ' ⚠️';
                }

                linha.innerHTML = `
                    <td>${produto.id}</td>
                    <td>${produto.nome}</td>
                    <td>${produto.descricao ?? ''}</td>
                    <td>R$ ${Number(produto.preco).toFixed(2).replace('.', ',')}</td>
                    <td class="${classeEstoque}">${est}${iconeEstoque}</td>
                    <td>${produto.categoria?.nome ?? ''}</td>
                    <td>${produto.ativo ? 'Sim' : 'Não'}</td>
                    <td>
                        <button
                            type="button"
                            class="botao botao-secundario"
                            onclick="editarProduto(${produto.id})">
                            Editar
                        </button>

                        <button
                            type="button"
                            class="botao botao-perigo"
                            onclick="excluirProduto(${produto.id})">
                            Excluir
                        </button>
                    </td>
                `;

                tabela.appendChild(linha);
            });

        } catch (erro) {

            console.error(erro);

            document.getElementById('tabelaProdutos').innerHTML = `
                <tr>
                    <td colspan="8">
                        Erro ao carregar os produtos.
                    </td>
                </tr>
            `;
        }
    }

    function mostrarFormulario() {

        document.getElementById('tituloFormulario').textContent =
            'Novo produto';

        document.getElementById('formProduto').reset();

        document.getElementById('produtoId').value = '';

        document.getElementById('ativo').value = 'true';

        document.getElementById('formularioProduto').style.display =
            'block';

        carregarCategorias();
    }

    function ocultarFormulario() {

        document.getElementById('formularioProduto').style.display =
            'none';

        document.getElementById('formProduto').reset();

        document.getElementById('produtoId').value = '';
    }

    async function editarProduto(id) {

        try {

            const resposta = await fetch(`/produtos/${id}`);

            if (!resposta.ok) {
                throw new Error('Produto não encontrado.');
            }

            const produto = await resposta.json();

            await carregarCategorias();

            document.getElementById('tituloFormulario').textContent =
                'Editar produto';

            document.getElementById('produtoId').value = produto.id;
            document.getElementById('nome').value = produto.nome;
            document.getElementById('descricao').value = produto.descricao ?? '';
            document.getElementById('preco').value = produto.preco;
            document.getElementById('estoque').value = produto.estoque;
            document.getElementById('categoria').value = produto.categoria.id;
            document.getElementById('ativo').value = String(produto.ativo);

            document.getElementById('formularioProduto').style.display =
                'block';

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        } catch (erro) {

            console.error(erro);

            mostrarMensagem(erro.message, 'erro');
        }
    }

    async function excluirProduto(id) {

        const confirmar = confirm(
            'Tem certeza que deseja excluir este produto?'
        );

        if (!confirmar) {
            return;
        }

        try {

            const resposta = await fetch(`/produtos/${id}`, {
                method: 'DELETE'
            });

            if (!resposta.ok) {

                let mensagem =
                    'Não foi possível excluir o produto.';

                try {

                    const dados = await resposta.json();

                    if (dados.message) {
                        mensagem = dados.message;
                    }

                } catch (erro) {
                    // Mantém mensagem padrão.
                }

                throw new Error(mensagem);
            }

            mostrarMensagem('Produto excluído com sucesso.', 'sucesso');

            carregarProdutos();

        } catch (erro) {

            console.error(erro);

            mostrarMensagem(erro.message, 'erro');
        }
    }

    document
        .getElementById('formProduto')
        .addEventListener('submit', async function (evento) {

            evento.preventDefault();

            const id = document.getElementById('produtoId').value;

            const produto = {
                nome: document.getElementById('nome').value,
                descricao: document.getElementById('descricao').value,
                preco: Number(document.getElementById('preco').value),
                estoque: Number(document.getElementById('estoque').value),
                ativo: document.getElementById('ativo').value === 'true',
                categoria: {
                    id: Number(document.getElementById('categoria').value)
                }
            };

            try {

                const url = id ? `/produtos/${id}` : '/produtos';
                const metodo = id ? 'PUT' : 'POST';

                const resposta = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(produto)
                });

                let dados = null;

                try {
                    dados = await resposta.json();
                } catch (e) {
                    // resposta sem corpo
                }

                if (!resposta.ok) {
                    throw new Error(
                        (dados && dados.message) || 'Erro ao salvar produto.'
                    );
                }

                mostrarMensagem(
                    id ? 'Produto atualizado com sucesso.'
                       : 'Produto cadastrado com sucesso.',
                    'sucesso'
                );

                ocultarFormulario();
                carregarProdutos();

            } catch (erro) {

                console.error(erro);
                mostrarMensagem(erro.message, 'erro');
            }
        });

    carregarCategorias();
    carregarProdutos();

</script>

</body>

</html>
